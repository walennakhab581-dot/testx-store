{% extends "base.html" %}
{% block title %}จัดการtopups - แอดมิน{% endblock %}
{% block content %}
<div class="p-4 max-w-4xl mx-auto">
  <a href="{{ url_for('admin') }}" class="text-blue-400 text-sm">← กลับแดชบอร์ด</a>
  <h1 class="text-xl font-bold mt-2 mb-4">จัดการ topups</h1>
  <div class="bg-zinc-900 rounded-xl p-4 border border-zinc-800">
    <p class="text-gray-400">หน้านี้พร้อมใช้งานแล้ว (ข้อมูลจะแสดงเมื่อมีรายการ)</p>
    {% if topups %}
      <ul class="mt-3 space-y-2">
        {% for item in topups %}
          <li class="py-2 border-b border-zinc-800">{{ item }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  </div>
</div>
{% endblock %}

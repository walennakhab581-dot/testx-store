{% extends "base.html" %}
{% block title %}เข้าสู่ระบบ - TESTX{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
  <div class="bg-dark-800 border border-white/10 rounded-2xl p-6">
    <h1 class="text-xl font-bold text-center mb-6">เข้าสู่ระบบ</h1>
    <form method="POST" class="space-y-4">
      <div>
        <label class="text-sm text-gray-400">ชื่อผู้ใช้</label>
        <input type="text" name="username" required
               class="w-full mt-1 bg-dark-700 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500"
               placeholder="admin หรือ user">
      </div>
      <div>
        <label class="text-sm text-gray-400">รหัสผ่าน</label>
        <input type="password" name="password" required
               class="w-full mt-1 bg-dark-700 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500">
      </div>
      <button type="submit" class="w-full py-3 bg-blue-500 hover:bg-blue-600 rounded-xl font-medium">
        เข้าสู่ระบบ
      </button>
    </form>
    <p class="text-xs text-center text-gray-500 mt-5">
      แอดมิน: <b>admin</b> / <b>admin123</b><br>
      ผู้ใช้: <b>user</b> / <b>1234</b>
    </p>
    <p class="text-center text-sm mt-4">
      ยังไม่มีบัญชี? <a href="{{ url_for('register') }}" class="text-blue-400 hover:underline">สมัครสมาชิก</a>
    </p>
  </div>
</div>
{% endblock %}
